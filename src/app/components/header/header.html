<header>
  <form class="search-wrapper" (submit)="onSubmit($event, searchInput)">
    <input
      type="text"
      placeholder="Search..."
      required
      (keydown)="onKeyDown($event, searchInput)"
      #searchInput
    />
    <img class="search-icon" src="search.png" alt="search" />
  </form>
</header>
